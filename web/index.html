<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Mirrors rootAttributes() in src/lib/preferences.ts, so the first paint already has the user's look.
      (function () {
        var p = {};
        try {
          p = JSON.parse(localStorage.getItem('factory-preferences') || '{}') || {};
        } catch (e) {}
        var mode = p.mode || localStorage.getItem('factory-theme') || 'system';
        var dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        var d = document.documentElement.dataset;
        d.mode = dark ? 'dark' : 'light';
        var keys = { accent: 'accent', neutral: 'neutral', canvas: 'darkCanvas', density: 'density', text: 'text', radius: 'radius', typeface: 'typeface', motion: 'motion' };
        for (var k in keys) if (typeof p[keys[k]] === 'string') d[k] = p[keys[k]];
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23090b22'/%3E%3Cpath d='M8 22V10l8 5 8-5v12' fill='none' stroke='%23aea9f1' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>Software Factory</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
